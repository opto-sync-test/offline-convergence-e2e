name: full-stack offline convergence proof

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '47 9 * * 0'

permissions:
  contents: read

concurrency:
  group: fullstack-offline-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  E2E_SHA: 951260b48a1113593dee1e588e0e83db927f917f
  CLIENTS_SHA: 67a6912d0859e85532e9d72c379b6f2948803050
  SYNCER_C_SHA: 8d2b275a89062403666f4bdf196d246a07c84484
  SYNCER_RS_SHA: 27692fb7c7423999eaff45afa5bd64b1bf86ad57
  FLUTTER_VERSION: '3.44.2'

jobs:
  source-contract:
    name: immutable source and engine contract
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out the external proof harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Check out the exact client implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: opto-sync-clients
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Check out the exact C engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ env.SYNCER_C_SHA }}
          path: syncer.c
          persist-credentials: false
          show-progress: false

      - name: Check out the exact Rust engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/syncer.rs
          ref: ${{ env.SYNCER_RS_SHA }}
          path: syncer.rs
          persist-credentials: false
          show-progress: false

      - name: Check out the exact full-stack fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-e2e
          ref: ${{ env.E2E_SHA }}
          path: opto-sync-e2e
          persist-credentials: false
          show-progress: false

      - name: Verify every checkout and nested engine gitlink
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C opto-sync-clients rev-parse HEAD)" = "$CLIENTS_SHA"
          test "$(git -C syncer.c rev-parse HEAD)" = "$SYNCER_C_SHA"
          test "$(git -C syncer.rs rev-parse HEAD)" = "$SYNCER_RS_SHA"
          test "$(git -C opto-sync-e2e rev-parse HEAD)" = "$E2E_SHA"
          test "$(git -C opto-sync-clients rev-parse HEAD:syncer.c)" = "$SYNCER_C_SHA"
          test "$(git -C opto-sync-clients/syncer.c rev-parse HEAD)" = "$SYNCER_C_SHA"
          test -f opto-sync-clients/clients/reactive-ts/src/service-worker.ts
          test -f opto-sync-clients/clients/reactive-dart/lib/opto_sync_reactive.dart
          test -f opto-sync-clients/clients/flutter_background/lib/opto_sync_flutter_background.dart
          test -f opto-sync-e2e/suite/protocol/ws-transport.mjs
          git -C opto-sync-clients submodule status --cached syncer.c

  live-client-convergence:
    name: TS IndexedDB + Dart SQLite + Rust SQLite against Postgres
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Check out exact full-stack fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-e2e
          ref: ${{ env.E2E_SHA }}
          path: opto-sync-e2e
          persist-credentials: false
          show-progress: false

      - name: Check out exact C engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ env.SYNCER_C_SHA }}
          path: syncer.c
          persist-credentials: false
          show-progress: false

      - name: Check out exact clients and their engine gitlink
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: opto-sync-clients
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Use Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: opto-sync-clients/clients/ts/package-lock.json

      - name: Use stable Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1
        with:
          sdk: stable

      - name: Install the SQLite runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsqlite3-0

      - name: Build the exact C core shared library
        working-directory: opto-sync-clients/syncer.c/core
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          cmake ..
          cmake --build . --target syncer --parallel 2
          test -f libsyncer.so

      - name: Build the exact TypeScript client and browser engine
        run: |
          set -euo pipefail
          cd opto-sync-clients/syncer.c/bindings/typescript
          npm ci
          cd ../../../clients/ts
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Resolve Dart and the candidate Rust dependency graph
        run: |
          set -euo pipefail
          cd opto-sync-e2e/suite/clients/dart
          dart pub get
          cd ../rust
          # The upstream fixture lock still describes its older default client
          # pin. Resolve the exact candidate path dependency here, then keep all
          # executable phases offline so registry state cannot change mid-run.
          cargo fetch

      - name: Prepare and start the native Postgres-backed server
        run: |
          set -euo pipefail
          cp opto-sync-e2e/context.dockerignore .dockerignore
          test -s opto-sync-e2e/.env
          cd opto-sync-e2e
          docker compose config --quiet
          docker compose up -d --build postgres node
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 3 http://localhost:3003/health > "$RUNNER_TEMP/health.json"; then
              grep -q '"syncer":"native"' "$RUNNER_TEMP/health.json" && exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'native Postgres-backed server did not become healthy' >&2
              exit 1
            fi
            sleep 2
          done

      - name: Run each client against live HTTP and Postgres
        env:
          OPTO_SYNC_REQUIRE_SERVER: '1'
          OPTO_SYNC_SERVER_URL: http://localhost:3003
          SYNCER_LIB_PATH: ${{ github.workspace }}/opto-sync-clients/syncer.c/core/build/libsyncer.so
        run: |
          set -euo pipefail
          cd opto-sync-e2e/suite/clients/ts
          node --test
          cd ../dart
          dart test --reporter expanded
          cd ../rust
          cargo test --offline --test scenarios -- --test-threads=1 --nocapture

      - name: Prove commit-before-ack restart recovery in all three stores
        env:
          OPTO_SYNC_REQUIRE_SERVER: '1'
          OPTO_SYNC_SERVER_URL: http://localhost:3003
          SYNCER_LIB_PATH: ${{ github.workspace }}/opto-sync-clients/syncer.c/core/build/libsyncer.so
        run: |
          set -euo pipefail
          restart="$RUNNER_TEMP/restart-proof"
          mkdir -p "$restart"
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd opto-sync-e2e/suite/clients/ts
          node protocol-restart.mjs "$restart/ts-profile" "org-ts-restart-$nonce"
          cd ../dart
          dart run bin/protocol_restart.dart prepare "$restart/dart.sqlite" "$restart/dart-envelope.json" "org-dart-restart-$nonce"
          dart run bin/protocol_restart.dart recover "$restart/dart.sqlite" "$restart/dart-envelope.json" "org-dart-restart-$nonce"
          cd ../rust
          cargo run --offline --quiet --bin protocol-restart -- prepare "$restart/rust.sqlite" "$restart/rust-envelope.json" "org-rust-restart-$nonce"
          cargo run --offline --quiet --bin protocol-restart -- recover "$restart/rust.sqlite" "$restart/rust-envelope.json" "org-rust-restart-$nonce"

      - name: Prove cross-language oldest-first convergence
        env:
          OPTO_SYNC_REQUIRE_SERVER: '1'
          OPTO_SYNC_SERVER_URL: http://localhost:3003
          SYNCER_LIB_PATH: ${{ github.workspace }}/opto-sync-clients/syncer.c/core/build/libsyncer.so
        run: |
          set -euo pipefail
          cd opto-sync-e2e/suite/clients/ts
          node converge.mjs setup
          node converge.mjs flush
          cd ../dart
          dart run bin/converge.dart flush
          cd ../rust
          cargo run --offline --quiet --bin converge -- flush
          cd ../ts
          node converge.mjs verify
          cd ../dart
          dart run bin/converge.dart verify
          cd ../rust
          cargo run --offline --quiet --bin converge -- verify

      - name: Show server evidence on failure
        if: failure()
        working-directory: opto-sync-e2e
        run: docker compose logs --no-color --timestamps --tail=250 || true

      - name: Stop the isolated stack
        if: always()
        working-directory: opto-sync-e2e
        run: docker compose down -v --remove-orphans || true

  reactive-typescript:
    name: RxJS optimism + real service worker + IndexedDB
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: opto-sync-clients
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Use Node 22.16
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: |
            opto-sync-clients/clients/ts/package-lock.json
            opto-sync-clients/clients/reactive-ts/package-lock.json

      - name: Build the core client and install Chromium
        run: |
          set -euo pipefail
          cd opto-sync-clients/syncer.c/bindings/typescript
          npm ci
          cd ../../../clients/ts
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Test core browser, worker, and RxJS orchestration
        run: |
          set -euo pipefail
          cd opto-sync-clients/clients/ts
          npm run test:node
          npm run test:browser
          npm run test:service-worker-browser
          cd ../reactive-ts
          npm ci
          npm test
          npm run test:browser

  reactive-dart-flutter:
    name: RxDart optimism + Flutter background worker
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: opto-sync-clients
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Install pinned Flutter and Dart
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build the pinned native core for Dart FFI tests
        working-directory: opto-sync-clients/syncer.c/core
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          cmake ..
          cmake --build . --target syncer --parallel 2
          test -f libsyncer.so

      - name: Test the Drift, SQLite, and RxDart client
        working-directory: opto-sync-clients/clients/dart
        env:
          SYNCER_LIB_PATH: ${{ github.workspace }}/opto-sync-clients/syncer.c/core/build/libsyncer.so
        run: |
          set -euo pipefail
          dart pub get
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test --reporter=expanded

      - name: Test RxDart source fusion and bounded background execution
        working-directory: opto-sync-clients/clients/reactive-dart
        run: |
          set -euo pipefail
          dart pub get
          dart run tool/self_test.dart
          dart run tool/background_contract_test.dart
          dart run tool/background_failure_test.dart
          python3 tool/check_native_background_adapters.py

      - name: Test the Flutter headless dispatcher
        working-directory: opto-sync-clients/clients/flutter_background
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test --reporter=expanded

  rust-native-wasm:
    name: Rust native client + pure Rust engine in Node and Chromium
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: opto-sync-clients
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Check out exact pure Rust engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/syncer.rs
          ref: ${{ env.SYNCER_RS_SHA }}
          path: syncer.rs
          persist-credentials: false
          show-progress: false

      - name: Install Rust with WebAssembly target
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Use Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: syncer.rs/tests/wasm/package-lock.json

      - name: Test native Rust client and WASM connectivity adapter
        run: |
          set -euo pipefail
          cd opto-sync-clients/clients/rust
          cargo test --all-targets --no-fail-fast
          cd ../rust-connectivity
          cargo test --all-targets --no-fail-fast
          cargo check --target wasm32-unknown-unknown --features wasm

      - name: Test the pure Rust merge engine with WASM enabled
        working-directory: syncer.rs
        run: cargo test --all-targets --features wasm

      - name: Build the browser package
        working-directory: syncer.rs
        run: |
          set -euo pipefail
          cargo install --locked --version 0.15.0 wasm-pack
          wasm-pack build --release --target web --out-dir pkg-web -- --features wasm

      - name: Execute one WASM artifact in Node and real Chromium
        working-directory: syncer.rs/tests/wasm
        run: |
          set -euo pipefail
          npm ci
          npm run test:node
          npx playwright install --with-deps chromium
          npm run test:browser

  backend-transport-parity:
    name: ${{ matrix.label }}
    needs: source-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: crossserver
            label: full-stack Node + Dart + Rust server convergence
          - id: websocket-tcp
            label: HTTP + WebSocket + TCP frame parity
          - id: supabase
            label: Supabase/PostgREST backend parity
    steps:
      - name: Check out exact full-stack fixtures
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-e2e
          ref: ${{ env.E2E_SHA }}
          path: opto-sync-e2e
          persist-credentials: false
          show-progress: false

      - name: Check out exact C engine
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/syncer.c
          ref: ${{ env.SYNCER_C_SHA }}
          path: syncer.c
          persist-credentials: false
          show-progress: false

      - name: Check out exact clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: ${{ env.CLIENTS_SHA }}
          path: opto-sync-clients
          persist-credentials: false
          show-progress: false
          submodules: recursive

      - name: Prepare the isolated build context
        run: |
          set -euo pipefail
          cp opto-sync-e2e/context.dockerignore .dockerignore
          test -s opto-sync-e2e/.env
          cd opto-sync-e2e
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml config --quiet

      - name: Run full-stack server convergence
        if: matrix.id == 'crossserver'
        working-directory: opto-sync-e2e
        run: |
          docker compose --profile crossserver --profile fullstack --profile dart --profile sagitta \
            up --build --exit-code-from cross-server

      - name: Run HTTP, WebSocket, and raw TCP parity
        if: matrix.id == 'websocket-tcp'
        working-directory: opto-sync-e2e
        run: |
          docker compose build node
          docker compose --profile wstest up --build --exit-code-from ws-protocol

      - name: Start the Supabase-compatible PostgREST path
        if: matrix.id == 'supabase'
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            up -d --build postgrest rust-mash

      - name: Run the Supabase backend suite
        if: matrix.id == 'supabase'
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            --profile supabasetest run --rm supabase-test

      - name: Show container evidence on failure
        if: failure()
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            logs --no-color --timestamps --tail=250 || true

      - name: Stop the isolated stack
        if: always()
        working-directory: opto-sync-e2e
        run: |
          docker compose -f docker-compose.yml -f docker-compose.supabase.yml \
            down -v --remove-orphans || true
